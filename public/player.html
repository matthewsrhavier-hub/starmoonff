<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Starmoon Player</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        iframe { border: none; width: 100%; height: 100%; }
        #shield { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 99999; background: rgba(0,0,0,0); cursor: pointer; }
        #err { display:none; color:#fff; font-family: system-ui, sans-serif; text-align:center; padding: 2rem; }
    </style>
    <script>
        (function() {
            try {
                Object.defineProperty(window, 'top', { get: () => window });
                Object.defineProperty(window, 'parent', { get: () => window });
            } catch (e) {}

            window.open = function() { return { focus: function(){}, close: function(){} }; };

            window.addEventListener('mousedown', function(e) {
                const shield = document.getElementById('shield');
                if (shield && shield.style.display !== 'none') {
                    shield.style.display = 'none';
                    e.preventDefault();
                    e.stopPropagation();
                    setTimeout(() => { shield.style.display = 'block'; }, 3000);
                }
            }, true);
        })();

        function loadPlayer() {
          const params = new URLSearchParams(window.location.search);
          const playerUrl = params.get('url');
          const frame = document.getElementById('player-frame');
          const err = document.getElementById('err');
          if (!playerUrl) {
            err.style.display = 'block';
            err.textContent = 'URL do player ausente.';
            return;
          }
          try {
            frame.src = decodeURIComponent(playerUrl);
          } catch (e) {
            frame.src = playerUrl;
          }
        }
        window.onload = loadPlayer;
    </script>
</head>
<body>
    <div id="shield"></div>
    <p id="err"></p>
    <iframe
      id="player-frame"
      allowfullscreen
      allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
      referrerpolicy="origin-when-cross-origin"
    ></iframe>
</body>
</html>
